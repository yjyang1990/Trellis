name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'marketplace'
      - '**/*.py'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, beta, 'feat/v*-beta']
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'marketplace'
      - '**/*.py'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup minimum supported Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Check Python 3.9 syntax
        run: |
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/trellis-pycache"
          git ls-files -z --recurse-submodules '*.py' | xargs -0 python -m py_compile

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (core + cli)
        run: pnpm typecheck

      - name: Typecheck Python
        run: pnpm --filter @mindfoldhq/trellis lint:py

      - name: Lint (core + cli)
        run: pnpm lint

      # Build before test: integration tests spawn the real CLI via
      # bin/trellis.js, which imports dist/ and needs build output to exist.
      - name: Build (core then cli)
        run: pnpm build

      - name: Test (core + cli)
        run: pnpm test

      - name: Test historical upgrades with packed CLI and core
        run: pnpm test:upgrade

      - name: Verify build output
        run: |
          set -euo pipefail
          test -d packages/core/dist
          test -f packages/core/dist/index.js
          test -f packages/core/dist/channel/index.js
          test -f packages/core/dist/task/index.js
          test -d packages/cli/dist
          test -f packages/cli/dist/index.js
          echo "Build verification passed"

      - name: Setup minimum supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.17.0'

      - name: Exercise built core and CLI on Node 18.17.0
        working-directory: packages/cli
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v18.17.0'
          node --input-type=module -e 'import "@mindfoldhq/trellis-core"'
          cli="$PWD/bin/trellis.js"
          project=$(mktemp -d)
          git -C "$project" init -q
          cd "$project"
          node "$cli" init --claude --yes -u smoke
          test -s .trellis/.version
          node "$cli" update --dry-run | tee update.log
          grep -F 'Already up to date!' update.log

  native-task-relationships:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Test Python task creation, relationships, and locking
        run: pnpm --filter @mindfoldhq/trellis exec vitest run test/scripts/task-relationships.integration.test.ts --testTimeout 60000
